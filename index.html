<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#141E36" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Yash &amp; Misha’s Wedding Saga — #YashMeGhuliMishri | Dec 13–14, 2026</title>

  <!-- Google Fonts: Great Vibes (Gold Script), Cormorant Garamond (Editorial Serif), Noto Serif Devanagari -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Great+Vibes&family=Noto+Serif+Devanagari:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --indigo-base: #17223B;
      --indigo-deep: #0E1629;
      --gold-light: #F5DFA0;
      --gold-primary: #E8C97A;
      --gold-metallic: #C8A248;
      --gold-bronze: #7D5F2A;
      --cream-primary: #F4EFE6;
      --periwinkle-sub: #B8C2D8;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100dvh;
      background-color: #160F10;
      color: var(--cream-primary);
      font-family: 'Cormorant Garamond', 'Noto Serif Devanagari', Georgia, serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Mobile Frame Container (430px centered on desktop, 100% full bleed on mobile) */
    .invite-shell {
      position: relative;
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      min-height: 100dvh;
      background-color: var(--indigo-base);
      box-shadow: 0 0 65px rgba(0, 0, 0, 0.85);
      overflow-x: hidden;
    }

    /* Seamless Royal Indigo Handmade Paper Texture */
    .indigo-paper {
      position: relative;
      background-color: #17223B;
      background-image: url('./paper.webp');
      background-repeat: repeat;
      background-size: 380px auto;
      background-position: top center;
    }

    /* Typography Classes */
    .font-script {
      font-family: 'Great Vibes', cursive;
      color: var(--gold-primary);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
      font-weight: 400;
    }

    .font-serif-ed {
      font-family: 'Cormorant Garamond', 'Noto Serif Devanagari', Georgia, serif;
    }

    .font-hindi {
      font-family: 'Noto Serif Devanagari', 'Cormorant Garamond', serif;
    }

    .font-ui {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* Ornamental Divider Image (divider.webp) */
    .ornate-divider-img {
      width: 172px;
      height: auto;
      display: block;
      margin: 10px auto 0;
    }

    /* Hero Text Entrance & Lit Glow State */
    .hero-text-hidden {
      opacity: 0.95;
      filter: blur(0);
      transform: translateY(0) scale(1);
      transition: opacity 0.9s cubic-bezier(0.22, 1, 0.36, 1), filter 0.9s cubic-bezier(0.22, 1, 0.36, 1), transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .hero-text-visible {
      opacity: 1;
      filter: drop-shadow(0 0 12px rgba(247, 227, 163, 0.35));
      transform: translateY(0) scale(1.015);
    }

    /* High-Contrast Hero Hashtag (#YashMeGhuliMishri) */
    .hero-hashtag {
      color: #F7E3A3;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      line-height: 1.25;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95), 0 0 16px rgba(212, 175, 55, 0.45);
    }

    /* Diya Flame Flicker Animation */
    @keyframes diyaFlicker {
      0%, 100% { transform: scaleY(1) scaleX(1) rotate(-1deg); opacity: 0.96; }
      33% { transform: scaleY(1.14) scaleX(0.93) rotate(1.5deg); opacity: 1; }
      66% { transform: scaleY(0.92) scaleX(1.05) rotate(-1.5deg); opacity: 0.89; }
    }
    .flame-flicker {
      transform-origin: center bottom;
      animation: diyaFlicker 1.6s infinite ease-in-out;
    }

    /* Gentle Floating Chevron */
    @keyframes gentleBounce {
      0%, 100% { transform: translateY(0); opacity: 0.8; }
      50% { transform: translateY(5px); opacity: 1; }
    }
    .chevron-bounce {
      animation: gentleBounce 2.2s infinite ease-in-out;
    }

    /* Scratch Card Styling */
    .scratch-card-frame {
      width: 105px;
      height: 128px;
      background: #F4EFE6;
      padding: 4.5px;
      border-radius: 12px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
      position: relative;
      user-select: none;
    }
    .scratch-card-inner {
      width: 100%;
      height: 100%;
      border-radius: 8.5px;
      background: linear-gradient(135deg, #F6E09E 0%, #D4AF48 48%, #FDF0C4 72%, #B58A2A 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #1A1205;
    }

    /* Hide Scrollbars for Carousel */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Bronze Gold Pill Button */
    .btn-bronze-pill {
      background: linear-gradient(180deg, #866830 0%, #684E20 100%);
      border: 1px solid rgba(217, 180, 91, 0.65);
      border-radius: 9999px;
      color: #F4EFE6;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255, 240, 195, 0.25);
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .btn-bronze-pill:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <!-- Hidden Reusable SVG Symbol for the 11 Countdown Diyas -->
  <svg width="0" height="0" class="hidden" aria-hidden="true">
    <defs>
      <radialGradient id="divFlameGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FFF6D6" stop-opacity="0.95" />
        <stop offset="50%" stop-color="#FF9E3B" stop-opacity="0.55" />
        <stop offset="100%" stop-color="#E85D1A" stop-opacity="0" />
      </radialGradient>
      <symbol id="single-diya" viewBox="0 0 36 36">
        <circle cx="18" cy="13" r="10" fill="url(#divFlameGlow)"/>
        <path d="M18 4 C14.8 10, 15 15.5, 18 19 C21 15.5, 21.2 10, 18 4 Z" fill="#FFE89E"/>
        <path d="M18 7.5 C16.2 11.5, 16.2 15, 18 17.5 C19.8 15, 19.8 11.5, 18 7.5 Z" fill="#FF9830"/>
        <path d="M6 20.5 C6 27, 11.2 30.5, 18 30.5 C24.8 30.5, 30 27, 30 20.5 Z" fill="#B54924" stroke="#E8C97A" stroke-width="1"/>
        <ellipse cx="18" cy="20.5" rx="12" ry="2.2" fill="#E8C97A"/>
      </symbol>
    </defs>
  </svg>

  <!-- Toast Notification -->
  <div id="toast-pill" role="status" aria-live="polite" class="fixed top-4 left-1/2 -translate-x-1/2 -translate-y-12 opacity-0 pointer-events-none z-[1000] px-4 py-2 rounded-full bg-[#0D1527]/95 border border-[#C8A248] text-[#F4EFE6] text-xs font-ui tracking-wide shadow-2xl transition-all duration-300">
    <span id="toast-text">Notification</span>
  </div>

  <!-- ===================================================================== -->
  <!-- MAIN MOBILE INVITATION SHELL (max-width: 430px)                       -->
  <!-- ===================================================================== -->
  <div class="invite-shell">

    <!-- =================================================================== -->
    <!-- FLOATING BOTTOM-RIGHT CONTROLS (Language हिं/EN + Audio Pause/Play)  -->
    <!-- =================================================================== -->
    <div class="fixed bottom-5 z-[900] flex flex-col items-center gap-2.5" style="right: max(16px, calc(50vw - 215px + 16px));">
      <!-- Language Toggle Button (हिं / EN) -->
      <button type="button" id="lang-toggle-fab" aria-label="Toggle Hindi or English" class="w-[42px] h-[42px] rounded-full bg-[#152039]/90 border border-[#C8A248]/55 text-[#F4EFE6] flex items-center justify-center text-sm font-hindi shadow-[0_6px_18px_rgba(0,0,0,0.55)] backdrop-blur-md active:scale-90 transition-transform">
        <span id="lang-fab-label">हिं</span>
      </button>

      <!-- Gold Audio Play/Pause Button (|| / ▶) -->
      <button type="button" id="audio-toggle-fab" aria-label="Toggle background wedding music" class="w-[52px] h-[52px] rounded-full bg-gradient-to-br from-[#F5DFA0] via-[#D8B256] to-[#B6892C] text-[#1A1205] flex items-center justify-center shadow-[0_8px_22px_rgba(0,0,0,0.65)] border border-[#FFF3C4]/60 active:scale-90 transition-transform">
        <!-- Play Icon -->
        <svg id="fab-icon-play" class="w-5 h-5 ml-0.5" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5v14l11-7z"/>
        </svg>
        <!-- Pause Icon -->
        <svg id="fab-icon-pause" class="w-5 h-5 hidden" viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 5h3.5v14H6V5zm8.5 0H18v14h-3.5V5z"/>
        </svg>
      </button>
    </div>

    <!-- =================================================================== -->
    <!-- SECTION 1: HERO — DEEPOTSAV AT RAM MANDIR & SARYU GHAT              -->
    <!-- =================================================================== -->
    <section id="hero-section" class="relative w-full h-[100dvh] min-h-[640px] max-h-[920px] overflow-hidden select-none bg-[#081326] cursor-pointer">
      <!-- Layer 1: Unlit Keyframe Image (opening-v2-first.webp) -->
      <img
        id="hero-img-first"
        src="./opening-v2-first.webp"
        alt="Ayodhya Ram Mandir and Saryu Ghat at Dusk"
        class="absolute inset-0 w-full h-full object-cover object-bottom z-[1]"
      />

      <!-- Layer 2: Progressive Reveal Canvas for Lit Keyframe (opening-v2-last.webp) + Colorful Sky Fireworks -->
      <canvas id="hero-stage-canvas" class="absolute inset-0 w-full h-full block z-[2] pointer-events-none"></canvas>

      <!-- Top starry sky contrast vignette so #YashMeGhuliMishri & names stand out clearly above the temple spire -->
      <div
        class="absolute inset-x-0 top-0 h-[34%] pointer-events-none z-[3]"
        style="background: linear-gradient(180deg, rgba(6, 12, 26, 0.78) 0%, rgba(6, 12, 26, 0.42) 68%, rgba(6, 12, 26, 0) 100%);"
      ></div>

      <!-- Bottom seamless gradient fade into paper.webp below -->
      <div
        class="absolute inset-x-0 bottom-0 h-24 pointer-events-none z-[3]"
        style="background: linear-gradient(180deg, rgba(23, 34, 59, 0) 0%, rgba(23, 34, 59, 0.75) 68%, #17223B 100%);"
      ></div>

      <!-- Interactive Play Prompt Before Lighting Starts -->
      <div
        id="tap-to-light-prompt"
        class="absolute inset-x-0 z-[6] flex flex-col items-center transition-opacity duration-500"
        style="bottom: calc(5.6rem + env(safe-area-inset-bottom, 0px));"
      >
        <button
          type="button"
          id="hero-play-trigger-btn"
          class="px-5 py-2.5 rounded-full bg-[#0B1528]/90 border border-[#E8C97A]/75 text-[#F5DFA0] text-[14px] font-serif-ed italic tracking-wide shadow-[0_8px_24px_rgba(0,0,0,0.8)] backdrop-blur-md flex items-center gap-2.5 hover:bg-[#14223D] active:scale-95 transition-all cursor-pointer"
        >
          <span class="w-6 h-6 rounded-full bg-gradient-to-br from-[#F5DFA0] to-[#C8A248] text-[#1A1205] flex items-center justify-center shadow">
            <svg class="w-3.5 h-3.5 ml-0.5" viewBox="0 0 24 24" fill="currentColor">
              <path d="M8 5v14l11-7z"/>
            </svg>
          </span>
          <span data-i18n="tapToLight">Tap Play to light the diyas of Ayodhya</span>
        </button>
      </div>

      <!-- Hero Title Block Shifted Higher into the Upper Starry Sky -->
      <div class="relative z-[5] pt-3 sm:pt-3.5 px-4 text-center flex flex-col items-center pointer-events-none">
        <p id="hero-line-1" class="hero-text-hidden text-[14px] tracking-[0.04em] text-[#F4EFE6]/95 font-serif-ed mb-0.5 drop-shadow-[0_2px_6px_rgba(0,0,0,0.9)]" data-i18n="heroWelcome">
          Welcome to the wedding of
        </p>

        <div id="hero-line-2" class="hero-text-hidden flex flex-col items-center leading-[0.88] my-0">
          <span class="font-script text-[2.85rem] sm:text-[3rem] text-[#F3D88C]" data-i18n="groomFirst">Yash</span>
          <span class="font-script text-[1.4rem] text-[#E8C97A] -my-1.5">&amp;</span>
          <span class="font-script text-[2.85rem] sm:text-[3rem] text-[#F3D88C]" data-i18n="brideFirst">Misha</span>
        </div>

        <div id="hero-line-3" class="hero-text-hidden flex flex-col items-center mt-0.5">
          <img
            src="./divider.webp"
            alt=""
            class="w-[136px] h-auto block mx-auto"
          />
          <p class="hero-hashtag mt-1 font-serif-ed px-3 py-0.5 rounded-full bg-[#081326]/55 border border-[#E8C97A]/30" data-i18n="ayodhyaCaps">
            #YashMeGhuliMishri
          </p>
        </div>
      </div>

      <!-- Bottom "Scroll down" Script Cue -->
      <div
        id="hero-scroll-cue"
        class="hero-text-hidden absolute inset-x-0 z-[5] flex flex-col items-center pointer-events-none"
        style="bottom: calc(1.75rem + env(safe-area-inset-bottom, 0px));"
      >
        <span class="font-script text-[1.75rem] text-[#F4EFE6]/95 tracking-wide drop-shadow-[0_2px_8px_rgba(0,0,0,0.9)]" data-i18n="scrollDown">Scroll down</span>
        <svg class="w-4 h-4 text-[#E8C97A] chevron-bounce -mt-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/>
        </svg>
      </div>
    </section>

    <!-- =================================================================== -->
    <!-- SEAMLESS INDIGO HANDMADE PAPER BODY (paper.webp)                    -->
    <!-- =================================================================== -->
    <div class="indigo-paper relative z-10 pb-14">

      <!-- ================================================================= -->
      <!-- SECTION 2: THE DATE — 3 GOLD FOIL SCRATCH CARDS                   -->
      <!-- ================================================================= -->
      <section id="section-date" class="pt-10 pb-8 px-6 text-center">
        <h2 class="font-script text-[2.85rem] leading-none" data-i18n="theDateHeading">The Date</h2>
        <img
          src="./divider.webp"
          alt=""
          class="ornate-divider-img mb-5"
        />

        <p class="text-[1.08rem] text-[#F4EFE6] tracking-wide flex items-center justify-center gap-2 mb-7">
          <span class="text-[#E8C97A] text-sm">✦</span>
          <span data-i18n="scratchPrompt">Scratch to reveal the date</span>
          <span class="text-[#E8C97A] text-sm">✦</span>
        </p>

        <!-- 3 Ivory-Framed Metallic Gold Scratch Cards -->
        <div class="flex items-center justify-center gap-3.5 max-w-[355px] mx-auto">
          <!-- DAY -->
          <div class="flex flex-col items-center">
            <div class="scratch-card-frame">
              <div class="scratch-card-inner">
                <span class="font-serif-ed text-[1.75rem] font-bold leading-none">13 &amp; 14</span>
                <span class="text-[10px] uppercase tracking-[0.16em] mt-1 font-semibold opacity-80">Sun &amp; Mon</span>
                <canvas class="scratch-foil-canvas absolute inset-0 w-full h-full cursor-pointer touch-none" data-card="day"></canvas>
              </div>
            </div>
            <span class="mt-2.5 text-[11px] tracking-[0.24em] uppercase text-[#B8C2D8]" data-i18n="dayLabel">DAY</span>
          </div>

          <!-- MONTH -->
          <div class="flex flex-col items-center">
            <div class="scratch-card-frame">
              <div class="scratch-card-inner">
                <span class="font-serif-ed text-[1.95rem] font-bold leading-none">Dec</span>
                <span class="text-[10px] uppercase tracking-[0.16em] mt-1 font-semibold opacity-80">December</span>
                <canvas class="scratch-foil-canvas absolute inset-0 w-full h-full cursor-pointer touch-none" data-card="month"></canvas>
              </div>
            </div>
            <span class="mt-2.5 text-[11px] tracking-[0.24em] uppercase text-[#B8C2D8]" data-i18n="monthLabel">MONTH</span>
          </div>

          <!-- YEAR -->
          <div class="flex flex-col items-center">
            <div class="scratch-card-frame">
              <div class="scratch-card-inner">
                <span class="font-serif-ed text-[1.95rem] font-bold leading-none">2026</span>
                <span class="text-[10px] uppercase tracking-[0.16em] mt-1 font-semibold opacity-80">Vikram 2083</span>
                <canvas class="scratch-foil-canvas absolute inset-0 w-full h-full cursor-pointer touch-none" data-card="year"></canvas>
              </div>
            </div>
            <span class="mt-2.5 text-[11px] tracking-[0.24em] uppercase text-[#B8C2D8]" data-i18n="yearLabel">YEAR</span>
          </div>
        </div>
      </section>

      <!-- ================================================================= -->
      <!-- SECTION 3: ROYAL RAM DARBAR INVITATION CARD                       -->
      <!-- ================================================================= -->
      <section id="section-card" class="py-8 px-4 text-center">
        <div class="relative max-w-[382px] mx-auto pt-12 pb-10 px-5">
          <!-- Thin Double-Line Gold Cusped Mughal/Rajput Arch SVG Frame -->
          <svg
            viewBox="0 0 380 790"
            fill="none"
            preserveAspectRatio="none"
            class="absolute inset-0 w-full h-full pointer-events-none"
            aria-hidden="true"
          >
            <defs>
              <path id="topArcPath" d="M 18,60 A 42,42 0 1,1 102,60" />
              <path id="bottomArcPath" d="M 102,60 A 42,42 0 1,1 18,60" />
            </defs>
            <!-- Outer Cusped Arch -->
            <path
              d="M 190 12
                 C 206 32
